[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigaudit"
version = "0.1.0"
description = "Audit a published gene-expression signature: does it beat random genes, survive proliferation adjustment, transfer across cohorts, and work equally well for every patient group?"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tejas Waikar" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "requests>=2.28", "pyarrow>=12"]

[project.optional-dependencies]
test = ["pytest>=7", "lifelines>=0.27"]

[project.scripts]
sigaudit = "sigaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
